<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Sound Controller</title>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; background: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; box-sizing: border-box; }
        .box { max-width: 320px; width: 100%; padding: 20px; border: 1px solid #eaeaea; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        input[type="text"] { width: 80%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; text-align: center; margin-bottom: 8px; font-size: 16px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 85%; font-size: 16px; }
        input[type="range"] { width: 100%; cursor: pointer; margin-top: 15px; }
        .val { font-weight: bold; color: #007bff; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="box">
    <h3 style="margin: 0 0 15px 0; color: #333;">Live Sound Controller</h3>
    <input type="text" id="roomIdInput" placeholder="Enter Admin Room ID">
    <button id="connectBtn">Connect</button>

    <input type="range" id="userSlider" min="0" max="100" value="0" disabled>
    <p>Current Setting: <span id="userVal" class="val">0</span>%</p>
    <p id="statusTxt" style="font-size: 0.85rem; color: #999; margin: 5px 0 0 0;">Enter Room ID to activate slider</p>
</div>

<!-- Load PeerJS securely from CDN -->
<script src="https://jsdelivr.net"></script>
<script>
    const slider = document.getElementById('userSlider');
const valDisplay = document.getElementById('userVal');
const roomIdInput = document.getElementById('roomIdInput');
const connectBtn = document.getElementById('connectBtn');
const statusTxt = document.getElementById('statusTxt');

let peer = new Peer(); 
let conn = null;

connectBtn.addEventListener('click', function() {
    const targetRoom = roomIdInput.value.trim();
    if(!targetRoom) return alert("Please enter a Room ID!");
    
    statusTxt.textContent = "Connecting to admin...";
    
    // FIX: Forces standard JSON packaging so Android and iPhone talk the same language
    conn = peer.connect(targetRoom, {
        serialization: "json",
        reliable: true
    });
    
    conn.on('open', function() {
        statusTxt.textContent = "Connected Live! Control active.";
        statusTxt.style.color = "#28a745";
        slider.disabled = false;
    });

    conn.on('close', function() {
        statusTxt.textContent = "Connection lost.";
        statusTxt.style.color = "#dc3545";
        slider.disabled = true;
    });
});

slider.addEventListener('input', function(e) {
    const val = e.target.value;
    valDisplay.textContent = val;
    if (conn && conn.open) {
        // Sends standard object package
        conn.send({ amplitude: parseInt(val) });
    }
});
</script>
</body>
</html>
